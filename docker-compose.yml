# ============================================
# docker-compose.yml — GiaSuConnect (Turlean)
# Chạy full stack (app + PostgreSQL): docker compose up -d
# Lần đầu: khởi tạo schema + seed (xem README mục "Chạy local")
# ============================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giasuconnect
      POSTGRES_PASSWORD: giasuconnect
      POSTGRES_DB: giasuconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giasuconnect -d giasuconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Dùng PostgreSQL local trong compose.
      # Nếu dùng Supabase: thay 2 dòng dưới bằng connection string Supabase
      # (pooled cho DATABASE_URL, direct cho DIRECT_URL)
      DATABASE_URL: postgresql://giasuconnect:giasuconnect@db:5432/giasuconnect
      DIRECT_URL: postgresql://giasuconnect:giasuconnect@db:5432/giasuconnect
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      # - CRON_SECRET=${CRON_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
