# CI Pipeline — chạy tự động trên mọi PR và push lên main/staging
# Hoàn toàn FREE cho public repo (unlimited minutes)
# Cho private repo: 2.000 minutes/tháng free

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy PostgreSQL URL — prisma generate/build không cần kết nối thật,
  # nhưng schema provider = postgresql yêu cầu biến này tồn tại
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: ESLint
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        if: github.ref == 'refs/heads/main'
        with:
          name: build-output
          path: |
            .next/standalone/
            .next/static/
          retention-days: 3
